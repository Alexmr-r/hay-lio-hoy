name: Ingesta automática

on:
  schedule:
    - cron: '*/10 * * * *'   # respaldo: GitHub retrasa mucho los programados (a veces horas)
  workflow_dispatch: {}       # la cadena de abajo y el botón manual

concurrency:
  group: ingesta
  cancel-in-progress: false

permissions:
  contents: read
  pages: write      # publicar el resumen en GitHub Pages
  id-token: write
  actions: write    # para que cada pasada lance la siguiente

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: ingesta
      - id: generar
        run: node index.js
        working-directory: ingesta
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
      # Solo se publica si el resumen ha cambiado.
      - if: steps.generar.outputs.cambiado == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ingesta/salida
      - if: steps.generar.outputs.cambiado == 'true'
        id: publicar
        uses: actions/deploy-pages@v4

  # Cadena: espera y lanza la siguiente pasada (cada ~10 min de verdad). Si ya hay una en cola, no lanza otra.
  siguiente:
    needs: ingesta
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sleep 420
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pendientes=$(gh run list --workflow ingesta.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          echo "En cola: $pendientes"
          if [ "$pendientes" = "0" ]; then gh workflow run ingesta.yml; else echo "Ya hay una pasada en cola"; fi
